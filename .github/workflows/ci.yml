name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["feature/**", "fix/**", "chore/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Check repository
        run: |
          test -f .github/CODEOWNERS
          if git grep -nE '^(<<<<<<< |>>>>>>> |=======$)' -- ':!*.md'; then
            echo "::error::Merge conflict markers found"
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run docs:check
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm --prefix backend run test:launcher
      - run: node scripts/verify/admin-isolation.mjs
      - run: node scripts/verify/local-production.mjs
